[workspace]
name = "dodo"
version = "0.0.1"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]  # needed for the git source dependencies below

[activation]
# Build the C/C++ FFI wrappers on activation. Each script skips work when
# its library is up to date.
scripts = [
    "dodo/tls/ffi/build.sh",
    "dodo/http/ffi/build.sh",
    "dodo/json/ffi/build.sh",
]

[dependencies]
mojo = ">=1.2.0,<2.0.0"
openssl = ">=3.6.1,<4"           # TLS
ca-certificates = ">=2025.1.31"  # default CA bundle
zlib = ">=1.3.1,<2"              # gzip / deflate decoding
libdeflate = ">=1.22,<2"         # gzip encoding
libbrotlicommon = ">=1.2.1,<2"   # br
libbrotlidec = ">=1.2.1,<2"
libbrotlienc = ">=1.2.1,<2"
simdjson = ">=4.6.11,<5"         # JSON parsing

# The activation scripts compile the wrappers with g++ on Linux.
[target.linux-64.dependencies]
gxx = ">=13"
sysroot_linux-64 = ">=2.34"

[target.linux-aarch64.dependencies]
gxx = ">=13"

[feature.fuzz.dependencies]
mozz = { git = "https://github.com/ehsanmok/mozz.git", tag = "v0.2.2" }

[feature.fuzz.tasks]
fuzz-build = "bash fuzz/run.sh"
fuzz = "bash fuzz/run.sh"

[feature.bench.target.linux-64.dependencies]
wrk = ">=4.2.0"

[environments]
default = { solve-group = "default" }
fuzz = { features = ["fuzz"], solve-group = "default" }
bench = { features = ["bench"], solve-group = "default" }

[tasks]
tests = "bash tests/tools/run_tests.sh"
tests-gen = "python3 tests/tools/gen_test_aggregates.py"
tls-certs = "bash tests/tools/make_tls_certs.sh"
check-sans-io = "bash tests/tools/check_sans_io.sh"
check-no-http-http2-cycle = "bash tests/tools/check_no_http_http2_cycle.sh"
format = "mojo format dodo tests fuzz"
