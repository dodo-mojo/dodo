name: package

# Builds and tests the conda package the way the modular-community channel
# does. Runs when the packaging or the native wrappers change, and before
# every release.
on:
  push:
    branches: [production]
  pull_request:
    paths:
      - packaging/**
      - tools/build_native.sh
      - dodo/*/ffi/**
      - pixi.toml
      - pixi.lock
      - .github/workflows/package.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          run-install: false
      - run: bash packaging/build_local.sh
